version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  cooldown:
    default-days: 14
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns:
      - "*"
- package-ecosystem: npm
  directory: "/"
  cooldown:
    default-days: 14
  schedule:
    interval: weekly
  groups:
    npm:
      patterns:
      - "*"
